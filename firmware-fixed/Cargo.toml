[package]
name = "otg-ep0-race-repro"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "otg-ep0-race-repro"
path = "../firmware/src/main.rs"

[features]
# Control run: do not start the interrupt-level load.
no-load = []

[dependencies]
# The proposed fix: embassy main (798395dd, as in `firmware/`) plus one commit,
# "synopsys-otg: do not re-arm EP0 OUT after the status stage of a control transfer".
# This source and rev are the only difference from `firmware/Cargo.toml`.
embassy-stm32 = { git = "https://github.com/nullcrimson/embassy", rev = "765d3c3360f1b478e8aceaf095020049157230e5", features = [
    "defmt",
    "stm32f429zi",
    "memory-x",
    "time-driver-any",
] }
embassy-executor = { git = "https://github.com/nullcrimson/embassy", rev = "765d3c3360f1b478e8aceaf095020049157230e5", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { git = "https://github.com/nullcrimson/embassy", rev = "765d3c3360f1b478e8aceaf095020049157230e5", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-1_000_000",
] }
embassy-usb = { git = "https://github.com/nullcrimson/embassy", rev = "765d3c3360f1b478e8aceaf095020049157230e5", features = ["defmt"] }
embassy-futures = { git = "https://github.com/nullcrimson/embassy", rev = "765d3c3360f1b478e8aceaf095020049157230e5" }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = 3
